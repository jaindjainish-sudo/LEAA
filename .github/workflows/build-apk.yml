
name: Build LEA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          )

          if "android.permission.ACCESS_FINE_LOCATION" not in content:
              content, count = re.subn(
                  r'(?m)^(\s*)<application\b',
                  permissions + r'\1<application',
                  content,
                  count=1
              )
              if count != 1:
                  raise RuntimeError("Could not find the application tag in AndroidManifest.xml")
              manifest.write_text(content)
          PY


      - name: Add native calling bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.CALL_PHONE" />\n'
          if "android.permission.CALL_PHONE" not in content:
              content, count = re.subn(
                  r'(?m)^(\s*)<application\b',
                  permission + r'\1<application',
                  content,
                  count=1
              )
              if count != 1:
                  raise RuntimeError("Could not update AndroidManifest.xml")
              manifest.write_text(content)

          java_dir = Path("android/app/src/main/java/com/lea/emergency")
          java_dir.mkdir(parents=True, exist_ok=True)

          plugin = r'''package com.lea.emergency;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "DirectCall",
              permissions = {
                  @Permission(
                      alias = "phone",
                      strings = { Manifest.permission.CALL_PHONE }
                  )
              }
          )
          public class DirectCallPlugin extends Plugin {
              @PluginMethod
              public void callNumber(PluginCall call) {
                  String number = call.getString("number");

                  if (number == null || number.trim().isEmpty()) {
                      call.reject("Phone number is required");
                      return;
                  }

                  if (getPermissionState("phone") != PermissionState.GRANTED) {
                      requestPermissionForAlias("phone", call, "phonePermissionCallback");
                      return;
                  }

                  startCall(call, number);
              }

              @PermissionCallback
              private void phonePermissionCallback(PluginCall call) {
                  if (getPermissionState("phone") == PermissionState.GRANTED) {
                      startCall(call, call.getString("number"));
                  } else {
                      call.reject("Phone permission denied");
                  }
              }

              private void startCall(PluginCall call, String number) {
                  try {
                      Intent intent = new Intent(
                          Intent.ACTION_CALL,
                          Uri.fromParts("tel", number, null)
                      );
                      getContext().startActivity(intent);

                      JSObject result = new JSObject();
                      result.put("started", true);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("Android could not start the call", e);
                  }
              }
          }
          '''

          # Remove the indentation used to keep this YAML block readable.
          import textwrap
          (java_dir / "DirectCallPlugin.java").write_text(
              textwrap.dedent(plugin).lstrip()
          )

          activity = java_dir / "MainActivity.java"
          activity.write_text('''package com.lea.emergency;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DirectCallPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          ''')
          PY


      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
