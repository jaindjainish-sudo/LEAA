
name: Build LEA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          )

          if "android.permission.ACCESS_FINE_LOCATION" not in content:
              content, count = re.subn(
                  r'(?m)^(\s*)<application\b',
                  permissions + r'\1<application',
                  content,
                  count=1
              )
              if count != 1:
                  raise RuntimeError("Could not find the application tag in AndroidManifest.xml")
              manifest.write_text(content)
          PY

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
